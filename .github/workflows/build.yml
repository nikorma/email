name: Compila APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, principale ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepara Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila l'APK di debug
        run: gradle assembleDebug --no-daemon

      - name: Rinomina l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/LiberoMail.apk

      - name: Carica l'APK come artifact scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: LiberoMail-debug-apk
          path: out/LiberoMail.apk
          if-no-files-found: error

      - name: Pubblica l'APK nelle Release (link diretto per il telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-build
          name: Ultima build LiberoMail
          body: "APK pronto da installare. Scaricalo dal telefono toccando LiberoMail.apk qui sotto."
          files: out/LiberoMail.apk
